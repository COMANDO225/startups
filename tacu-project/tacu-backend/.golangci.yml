# Configuracion de golangci-lint.
#
# Formato v2 (golangci-lint v2 lo cambio entero respecto a v1: los antiguos
# linters-settings e issues.exclude-rules se movieron dentro de "linters", y los
# formateadores salieron a su propia seccion "formatters"). Un archivo v1 aqui
# no se ignora: el binario aborta pidiendo "golangci-lint migrate".
version: "2"

run:
  # Los tests son mas de un tercio del codigo y son donde mas facil se escapa un
  # error sin comprobar.
  tests: true

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused. Es la base
  # sensata; "all" mete linters de estilo que solo generan ruido y se terminan
  # apagando uno por uno.
  default: standard

  enable:
    # Los dos que de verdad importan aqui, tal cual el encargo: contextos mal
    # propagados. El servicio pasa un ctx desde HTTP hasta la llamada a Gemini,
    # y perderlo por el camino significa que cancelar una peticion no cancela la
    # llamada que se esta pagando.
    - contextcheck
    # Peticiones HTTP sin contexto: http.Get en vez de http.NewRequestWithContext.
    - noctx
    # Cuerpos de respuesta HTTP sin cerrar: fuga de conexiones contra la API de IA.
    - bodyclose
    # Errores comparados con == en vez de errors.Is, y %v donde toca %w. Sin esto
    # una cadena de errores envueltos se rompe en silencio.
    - errorlint
    # return err donde err es nil habiendo detectado un fallo: el bug que hace
    # que una importacion fallida se reporte como exitosa.
    - nilerr

  settings:
    errcheck:
      # Una asercion de tipo sin comprobar es un panico en produccion, no un
      # detalle de estilo.
      check-type-assertions: true
    staticcheck:
      # QF1008 pide quitar el campo embebido del selector (x.Precio.Procedencia
      # -> x.Procedencia). En el dominio de la carta el camino largo es el que
      # dice de donde sale el dato; acortarlo esconde que Procedencia es del
      # precio y no del plato. Los QF son sugerencias de editor, no defectos.
      #
      # OJO: escribir "checks" PISA la lista por defecto, no la extiende. Los
      # seis ST1xxx de abajo son los que golangci-lint apaga de fabrica y que
      # reaparecen en cuanto uno toca esta clave: exigen que el comentario de
      # cada simbolo exportado empiece por su nombre, en ingles y en su forma
      # gramatical. Aqui los comentarios estan en espanol y explican POR QUE, no
      # como se llama la funcion. Se quitaron, no se olvidaron.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1008
    govet:
      enable:
        # Un context cancelable cuyo cancel no se llama filtra una goroutine por
        # peticion. Este proyecto crea varios (arranque, apagado, cada llamada
        # a un modelo).
        - lostcancel
        - nilness

  exclusions:
    # El codigo de sqlc lleva la cabecera "Code generated by ... DO NOT EDIT" y
    # no tiene sentido lintarlo: no se puede arreglar sin que el generador lo
    # pise en la siguiente corrida de "make generar".
    generated: strict
    rules:
      # En los tests, un Close sin comprobar o una peticion armada sin contexto
      # no arriesgan datos ni fugan nada que sobreviva al proceso, y exigirlo
      # llena los archivos de ruido que tapa los hallazgos que si importan. En
      # codigo de produccion estos cuatro siguen encendidos.
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - noctx
          - contextcheck

formatters:
  enable:
    - gofmt
    - goimports
